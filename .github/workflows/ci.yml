name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: dotnet test tests/LinuxHub.Tests/LinuxHub.Tests.csproj --configuration Release --nologo

      # Task 7.3: analisa os scripts elevados versionados (D11) — o corpo deles nunca é
      # interpolado a partir de C#, então esta é a única checagem estática que os cobre.
      - name: PSScriptAnalyzer sobre Scripts/
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path Scripts -Recurse -Severity Error
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) error-severity issue(s) under Scripts/."
          }
          Write-Output "PSScriptAnalyzer: no error-severity findings."

  # own-linux-installer task 3.4: o instalador Linux-side agora vive em live-media/
  # (bash fixo, versionado, D1) — o installer/ órfão foi removido (D2). shellcheck
  # cobre estilo/armadilhas comuns; bash -n permanece como checagem de sintaxe pura.
  # Job Linux (não windows-latest, que não traz shellcheck pré-instalado) — bug real
  # encontrado num run de CI: "shellcheck: command not found" no runner Windows.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck sobre live-media/
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! shellcheck "$file"; then
              echo "FALHOU: $file"
              status=1
            fi
            if ! bash -n "$file"; then
              echo "FALHOU (sintaxe): $file"
              status=1
            fi
          done < <(find live-media -name '*.sh' -print0)
          exit $status

  # own-linux-installer tasks 1.3/10.7: a mídia live reconstrói no CI a partir das fontes
  # versionadas — prova que o pipeline é reprodutível, não só que existe. Job Linux
  # separado do build-and-test (Windows) porque debootstrap/mksquashfs/grub-mkrescue só
  # existem nesse lado. Não valida boot nem Secure Boot (fase 1.4) — isso é VM, fora do CI.
  build-live-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas de build da mídia live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-common mtools

      # `bash script.sh` em vez de `./script.sh`: não depende do bit executável
      # sobrevivendo ao checkout no runner (bug real: "sudo: ...: command not found"
      # quando o arquivo foi commitado sem +x, comum ao editar em ambiente Windows).
      - name: Construir a mídia live
        run: sudo bash live-media/build/build-live-media.sh "${{ github.workspace }}/live-media-out"

      - name: Publicar o artefato da mídia live
        uses: actions/upload-artifact@v4
        with:
          name: linuxhub-live-media
          path: |
            live-media-out/linuxhub-live.iso
            live-media-out/linuxhub-live.iso.sha256
            live-media-out/linuxhub-live.manifest.json
          retention-days: 7
