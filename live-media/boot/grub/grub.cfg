# Configuração de boot da própria mídia live — carregada pelo firmware UEFI
# ao bootar esta ISO (D16: só x86_64-efi, sem entrada BIOS). Não confundir
# com Common/Data ou Features/InstallWizard/Services/GrubConfigBuilder.cs,
# que gera a entrada do lado Windows apontando *para* esta mídia.
set default=0
set timeout=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "LinuxHub - instalador" {
    linux /live/vmlinuz boot=live quiet nosplash console=tty1
    initrd /live/initrd.img
}
